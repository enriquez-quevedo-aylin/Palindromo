<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palíndromos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        height: 100vh;
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #7b2ff7, #f107a3);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      }

      .card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        border-radius: 20px;
        padding: 2rem;
        max-width: 450px;
        width: 90%;
        text-align: center;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 1.5rem;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 1rem;
        margin-bottom: 1rem;
        text-align: center;
        background-color: #000;  /* input negro */
        color: #fff;             /* letras blancas */
      }

      input::placeholder {
        color: #ccc;
      }

      button {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: none;
        font-weight: 600;
        font-size: 1rem;
        color: white;
        background-color: #8b5cf6;
        transition: 0.3s;
        margin-bottom: 1rem;
      }

      button:hover {
        background-color: #6d28d9;
      }

      #resultado {
        margin-top: 15px;
        padding: 12px;
        border-radius: 10px;
        font-size: 1.2rem;
        font-weight: 600;
        display: none;
        text-align: center;
      }

      .palindromo {
        background-color: #1e4620; /* verde oscuro sólido */
        color: #90ee90;            /* texto verde claro */
      }

      .no-palindromo {
        background-color: #4b1e1e; /* rojo oscuro sólido */
        color: #ff6b6b;            /* texto rojo claro */
      }

      .corecto{
         background-color: #1e4620; /* verde oscuro sólido */
        color: #90ee90;   
      }

      .no-correcto{
        background-color: #4b1e1e; /* rojo oscuro sólido */
        color: #ff6b6b;
      }

      small {
        display: block;
        margin-top: 10px;
        color: #ccc;
      }
    </style>
</head>
<body>

    <div class="card">
        <h1>Verificamos si es un palíndromo</h1>
        <input type="text" id="texto" placeholder="Escribe la palabra o frase">
        <button id="verificar">Verificar</button>
        <div id="resultado"></div>
        <small>* Solo se permiten letras y espacios.</small>
    </div>  

    <script src="./bundle.js"></script>  
</body>
</html>
